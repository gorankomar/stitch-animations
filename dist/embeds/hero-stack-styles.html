<style>
.stacked-windows_wrap {
  position: relative;
  --shadow-lg: 7rem -1rem 2rem rgba(0, 0, 0, 0.07);
}



/* safari-safe layer settings */
.stacked-windows_position {
  --stack-index: 0;
  --stack-x: calc(var(--stack-index) * 5%);
  --stack-y: calc(var(--stack-index) * -19%);
  --stack-z: 0px;
  backface-visibility: hidden;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
  z-index: var(--stack-layer, calc(8 - var(--stack-index)));
  flex: none;
  width: 50svw;
  min-width: 100vh;
  position: var(--stack-position, absolute);
  bottom: 0;
  transform: translate3d(
    var(--stack-x, 0%),
    var(--stack-y, 0%),
    var(--stack-z, 0)
  );
}

/* Static geometry is identical in Designer, Preview and with no runtime. */
.stacked-windows_position:first-child { --stack-position: relative; }
.stacked-windows_position:nth-child(n + 2) { --stack-z: calc(-1px - var(--stack-index) * 1px); }
.stacked-windows_position:nth-child(2) { --stack-index: 1; }
.stacked-windows_position:nth-child(3) { --stack-index: 2; }
.stacked-windows_position:nth-child(4) { --stack-index: 3; }
.stacked-windows_position:nth-child(5) { --stack-index: 4; }
.stacked-windows_position:nth-child(6) { --stack-index: 5; }
.stacked-windows_position:nth-child(7) { --stack-index: 6; }
.stacked-windows_position:nth-child(8) { --stack-index: 7; }
@media screen and (max-width: 991px) {
  .stacked-windows_position {
    --stack-x: calc(var(--stack-index) * 10%);
    --stack-y: calc(38% - var(--stack-index) * 19%);
  }
}

/* WRAPPER (never change opacity — backdrop stays alive) */
.stacked-windows_img-wrap {
  --reveal-offset: 70%;
  --reveal-transform: translate3d(0, var(--reveal-offset), 1px);
  --reveal-transform-active: translate3d(0, 0, 1px);
  backface-visibility: hidden;
  -webkit-transform-style: preserve-3d;
  transform-style: preserve-3d;
  background-color: var(--color-scheme-1--background-o80);
  box-shadow: var(--shadow-lg);
  border-color: rgba(0,0,0,0.1);
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border-style: solid;
  border-width: 1px;
  border-radius: 0.5rem;
  position: relative;
  overflow: hidden;
}

/* Reveal owns transform/opacity. Translate composes the lift independently. */
.stacked-windows_wrap .stacked-windows_img-wrap[data-reveal],
.stacked-windows_wrap .stacked-windows_img-wrap[data-reveal].is-reveal-ready:not([data-reveal="false"]):not([data-reveal-mode="hard"]) {
  transition:
    transform var(--reveal-duration, var(--reveal-duration-default)) var(--motion-ease-primary),
    opacity var(--reveal-opacity-duration, var(--reveal-opacity-duration-default)) linear,
    translate var(--motion-duration-default) var(--motion-ease-primary),
    background-color var(--motion-duration-default) var(--motion-ease-primary);
}

.stacked-windows_wrap .stacked-windows_img-wrap:not(.is-reveal-ready) {
  opacity: 1;
  transform: translate3d(0, 0, 1px);
}

.stacked-windows_img-wrap img {
  transition:
    opacity var(--motion-duration-default) linear,
    filter var(--motion-duration-default) var(--motion-ease-primary);
}

@media (hover: hover) and (pointer: fine) and (prefers-reduced-motion: no-preference) {
  html:not(.wf-design-mode) .stacked-windows_wrap .stacked-windows_img-wrap:hover {
    translate: 0 -10%;
    background-color: color-mix(in srgb, var(--color-scheme-1--background-o80) 50%, transparent);
  }

  html:not(.wf-design-mode) .stacked-windows_wrap:has(.stacked-windows_img-wrap:hover)
    .stacked-windows_img-wrap:not(:hover) img {
    filter: grayscale(100%);
    opacity: .52;
  }
}

.stacked-windows_img {
  width: 100%;
  max-width: none;
  height: auto;
  display: block;
}

.stacked-windows_skew {
  position: relative;
  transform: skewY(8deg);
}

/* ===== Webflow Designer – always visible ===== */
html.wf-design-mode .stacked-windows_img-wrap {
  transform: none !important;
  background-color: var(--color-scheme-1--background-o80) !important;
  box-shadow: var(--shadow-lg) !important;
  border-color: rgba(0,0,0,0.1) !important;
}
html.wf-design-mode .stacked-windows_img-wrap img {
  opacity: 1 !important;
  filter: none !important;
}

/* ===== Accessibility ===== */
@media (prefers-reduced-motion: reduce) {
  [data-anim="hero"] [data-reveal],
  .stacked-windows_img-wrap,
  .stacked-windows_img-wrap img {
    transition: none !important;
    transform: none !important;
    opacity: 1 !important;
    filter: none !important;
  }
}

</style>
