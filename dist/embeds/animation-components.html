<style>/* Global Styles → Animation Components. Reuse this class on a native background block. */
.features-graphic_grid-bg {
  --grid-size: 8cqi;
  --grid-line: 1px;
  background: radial-gradient(140% 120% at 0% 0%, #e6e6e6 0%, rgba(251, 251, 251, .35) 55%, rgba(251, 251, 251, 0) 100%);
  -webkit-mask-image: repeating-linear-gradient(to right, #000 0, #000 var(--grid-line), transparent var(--grid-line), transparent var(--grid-size)), repeating-linear-gradient(to bottom, #000 0, #000 var(--grid-line), transparent var(--grid-line), transparent var(--grid-size));
  -webkit-mask-position: 50% 50%, 50% 50%;
  mask-image: repeating-linear-gradient(to right, #000 0, #000 var(--grid-line), transparent var(--grid-line), transparent var(--grid-size)), repeating-linear-gradient(to bottom, #000 0, #000 var(--grid-line), transparent var(--grid-line), transparent var(--grid-size));
  mask-position: 50% 50%, 50% 50%;
}
/* Email Statement uses one full-frame grid. Outer geometry stays component-scoped. */
.es-container .features-graphic_grid-bg {position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Transient SVG overlay; the reusable check icon is untouched underneath. */
.es-check {position:relative}
.es-check .es-send-animation {position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.es-check[data-es-sending]>:not(.es-send-animation) {visibility:hidden}
.es-container{container-type:inline-size;writing-mode:horizontal-tb}.es-check>svg{display:block;width:7.407407cqi;height:7.407407cqi}.es-file-page>svg{display:block;width:2.962963cqi;height:3.703704cqi}.es-file-mark>svg{display:block;width:1.666667cqi;height:1.666667cqi}.es-success,.es-file-name{text-box-trim:trim-both;text-box-edge:cap alphabetic}.es-container[data-es-ready] [data-es-reveal]{opacity:0;transform:var(--es-reveal-start,translateY(2.222222cqi));transition:transform var(--motion-duration-default) var(--motion-ease-primary),opacity var(--es-opacity-duration,calc(var(--motion-duration-default) * var(--reveal-opacity-ratio))) linear}.es-container[data-es-ready] [data-es-reveal].is-reveal{opacity:1;transform:translateY(0)}.es-label{--es-reveal-start:translateX(-7.407407cqi);--es-opacity-duration:var(--motion-duration-default)}.es-card{--es-reveal-start:translateY(8.888889cqi);--es-opacity-duration:var(--motion-duration-default)}.es-check{--es-reveal-start:scale(.85)}.es-success,.es-attachments-title{--es-reveal-start:translateY(1.481481cqi)}@media(prefers-reduced-motion:reduce){.es-container[data-es-ready] [data-es-reveal]{opacity:1;transform:none;transition:none}}</style>
