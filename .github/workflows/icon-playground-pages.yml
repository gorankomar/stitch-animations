name: Publish icon playground

on:
  push:
    branches: [main]
    paths:
      - icon-playground.html
      - global.css
      - src/animations/icon-playground/**
      - src/embeds/icon-playground/assets/**
      - src/lib/**
      - vite.icon-playground.config.js
      - package.json
      - package-lock.json
      - .github/workflows/icon-playground-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icon-playground-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test tests/holder-tilt.test.js tests/icon-*.test.js
      - run: npm run build:icon-playground
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-icon-playground
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy icon presentation
        id: deployment
        uses: actions/deploy-pages@v4
