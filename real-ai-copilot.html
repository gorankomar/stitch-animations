<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="/src/embeds/real-ai-copilot-native.css">
<style>

  main { max-width: 536px; margin-inline: auto; }
</style>
<main>
<div class="real-ai-copilot" data-real-ai-copilot>

        <span class="real-ai-copilot-attach"><img src="/src/embeds/assets/real-ai-copilot/plus.svg" alt="">Attach</span>
        <span class="real-ai-copilot-hint">Fills 8 sections · you review before creating</span>
        <span class="real-ai-copilot-send"><img src="/src/embeds/assets/real-ai-copilot/arrowup.svg" alt=""></span>

    </div>
