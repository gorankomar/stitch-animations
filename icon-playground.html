<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stitch · Icon playground</title><link rel="stylesheet" href="/global.css"><link rel="stylesheet" href="/src/animations/icon-playground/styles.css"></head><body><main><header><span class="eyebrow">STITCH / MOTION LAB</span><h1>Small icons. Colossal motion.</h1><p>Hover near an icon or its size label to explore. Tune the details below.</p></header><div class="playground-controls"><section class="controls" aria-label="Animation controls"><label class="effect-control"><span class="control-label">Global icon effect</span><select id="effect"><option value="rising">Rising Color Soft Fill</option><option value="trace">Stroke Trace</option></select></label><label><span class="control-label">Hover duration <output id="duration-value">770 ms</output></span><input id="duration" type="range" min="150" max="2400" step="10" value="770"></label><label><span class="control-label">Stroke width <output id="stroke-value">1.4 px</output></span><input id="stroke" type="range" min="0.6" max="2.6" step="0.05" value="1.4"></label><label><span class="control-label">Icon color</span><input id="base-color" type="color" value="#3d3d3d"></label><label><span class="control-label">Hover color</span><input id="hover-color" type="color" value="#0070ff"></label><label class="toggle"><span class="control-label">Extra icon motion</span><span class="toggle-value"><input id="details" type="checkbox" role="switch" checked><span id="details-status" aria-hidden="true">On</span></span></label><label class="toggle"><span class="control-label">Holder tilt &amp; light</span><span class="toggle-value"><input id="holder-effect" type="checkbox" role="switch" checked><span id="holder-status" aria-hidden="true">On</span></span></label><button id="reset" type="button">Reset</button></section><p id="effect-description" aria-live="polite"></p></div><section id="grid" aria-label="Icons at four sizes"></section><footer>32 / 48 / 64 / 96 px containers · Keyboard focus previews hover · Stroke scales with icon size</footer><p id="error" role="alert" hidden></p></main><script type="module" src="/src/animations/icon-playground/index.js"></script></body></html>
