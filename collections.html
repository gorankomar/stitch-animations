<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Collections — Stitch</title>
<style>*{box-sizing:border-box}body{margin:0;background:white;color:#222;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}header{max-width:760px;margin:auto;padding:64px 28px 40px}header p{color:#888;font-size:14px;margin:0 0 12px}h1{font-size:32px;font-weight:500;letter-spacing:-1px;margin:0}main{max-width:760px;margin:0 auto;padding:0 24px 100px}footer{text-align:center;color:#aaa;font-size:13px;margin:28px 0}button{font:inherit;background:white;border:1px solid #ddd;border-radius:99px;padding:10px 18px;color:#555;cursor:pointer}button:hover{background:#f7f7f7}</style></head>
<body><header><p>STITCH / MOTION STUDIES</p><h1>Collections</h1></header><main><section data-anim="collections"><div data-collections-stage aria-label="Three collection windows cycling in a stack">
        <article data-collection-card>
          <h3>Attach document</h3>
          <div class="collection-upload"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 16a6 6 0 1 1 10-7 4 4 0 0 1 2 8M12 21V11m-4 4 4-4 4 4"/></svg><div><strong>Click to upload</strong> or drag a file</div><small>PDF Only (max. 1 MB)</small></div>
        </article>
        <article data-collection-card>
          <h3>Reassign collection record</h3>
          <div class="collection-label">User</div><div class="collection-field collection-field--select">Select user <span>⌄</span></div>
          <div class="collection-label">Comment</div><div class="collection-field collection-field--textarea">Enter comment</div>
        </article>
        <article data-collection-card>
          <h3>Collection details</h3>
          <div class="collection-label">Customer</div><div class="collection-field collection-field--select">Alex Morgan <span>⌄</span></div>
          <div class="collection-record"><span>Record number</span><span>COL–00284</span></div>
          <div class="collection-record"><span>Status</span><span>In progress</span></div>
          <div class="collection-record"><span>Assigned to</span><span>Collections team</span></div>
        </article>
      </div></section><footer><button id="replay" type="button">Replay entrance</button></footer></main><script type="module">
import { init } from '/src/animations/collections/index.js';
let dispose = init();
document.querySelector('#replay').addEventListener('click', () => { dispose(); dispose = init(); });
</script></body></html>
