<!doctype html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>@font-face{font-family:Diatype;src:url('/src/embeds/assets/real-time-approvals/body-regular.woff2')}body{margin:40px;background:#ddd;font-family:Diatype,sans-serif}.lp-film-poster{position:relative;aspect-ratio:16/9;max-width:1024px;margin:auto;overflow:hidden;border-radius:12px}.real-ai-background-video{position:absolute;width:100%;height:100%;object-fit:cover}.lp-film-play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:white;border-radius:50%;width:72px;height:72px;display:grid;place-items:center;pointer-events:none}.film-full-video { display: none; position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; }

 [data-film-player][data-film-started="true"] .film-controls { opacity: 1; visibility: visible; }

}

[data-film-player] .film-volume-group > .film-control { background: transparent; }
[data-film-player] .film-range { -webkit-appearance: none; }
