<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>3D Secure Authentication</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"><style>/* Webflow owns layout and appearance; these rules only drive animation state. */
.secure_graphic { --secure-open: 1; --secure-selected: 1; }
.secure_graphic [data-stitch-toggle] > div { transition: left 240ms cubic-bezier(.11,.61,.27,.99), transform 240ms cubic-bezier(.11,.61,.27,.99); }
.secure_auth { height: calc(28.294574cqi * var(--secure-open)); overflow: hidden; opacity: var(--secure-open); }
[data-stitch-toggle][data-state="active"] { background-color: #0ed948; }
[data-stitch-toggle][data-state="active"] > div { left: 100%; transform: translateX(-100%); }
.secure_radio-advanced { background-color: color-mix(in srgb, #121212 calc(var(--secure-selected) * 100%), white); border-color: color-mix(in srgb, #121212 calc(var(--secure-selected) * 100%), #e7e7e7); }
.secure_radio-dot { opacity: var(--secure-selected); }
@media (prefers-reduced-motion: reduce) {
  .secure_graphic [data-stitch-toggle] > div { transition: none; }
  .secure_cursor { display: none; }
  .secure_auth { height: 28.294574cqi; opacity: 1; }
  .secure_radio-advanced { background-color: #121212; border-color: #121212; }
  .secure_radio-dot { opacity: 1; }
}
</style></head><body style="margin:0;padding:40px 20px;background:white"><main style="max-width:516px;margin:auto"><div class="secure_graphic" data-secure-auth="" role="img" aria-label="3D Secure authentication: enable, choose Advanced, then disable">
  <div class="secure_window">
    <div class="secure_header"><div class="secure_dots"><span class="secure_dot"></span><span class="secure_dot"></span><span class="secure_dot"></span></div></div>
    <div class="secure_body">
      <div class="secure_intro"><div class="secure_title">3D secure</div><div class="secure_skeleton"><div class="secure_line"></div><div class="secure_line-short"></div></div></div>
      <div class="secure_toggle-row"><div class="secure_toggle-slot"><div class="stitch-toggle" data-stitch-toggle="" data-state="inactive"><div class="stitch-toggle_thumb"></div></div></div><div class="secure_label">Enable 3D secure</div></div>
      <div class="secure_auth"><div class="secure_auth-inner"><div class="secure_auth-title">Authentication</div><div class="secure_options">
        <div class="secure_option"><div class="secure_radio"></div><div class="secure_label">One-time pass code (OTP)</div></div>
        <div class="secure_option"><div class="secure_radio"></div><div class="secure_label">Knowledge-based authentication</div></div>
        <div class="secure_option"><div class="secure_radio"></div><div class="secure_label">One-time passcord (OPT) with knowledge-based authentication</div></div>
        <div class="secure_option"><div class="secure_radio secure_radio-advanced"><div class="secure_radio-dot"></div></div><div class="secure_label">Advanced</div></div>
      </div></div></div>
    </div>
  </div>
  <div class="secure_bubble" data-follow-mouse="" data-strength="0.03" data-max-offset="4"><div class="secure_icon-holder"><div class="secure_bank"><img class="secure_bank-preview" src="/src/embeds/assets/secure-auth/bank.svg" alt=""></div></div><div class="secure_copy"><div class="secure_bubble-title">Your bank purchase approval</div><div class="secure_bubble-message">Hello, Your bank requires your assistance in approving a transaction for USD 10,000.00</div></div></div>
  <div class="secure_cursor" aria-hidden="true"><div class="secure_cursor-shape"></div></div>
</div></main><script type="module" src="/src/embeds/secure-auth.js"></script></body></html>
