<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Worldwide Markets</title><style>body{margin:0;padding:32px;font-family:Arial;background:#fafafa}main{display:flex;gap:24px;align-items:start;flex-wrap:wrap}/* Global Styles → Animation Components. Reuse this class on a native background block. */
.features-graphic_grid-bg {
  --grid-size: 8cqi;
  --grid-line: 1px;
  background: radial-gradient(140% 120% at 0% 0%, #e6e6e6 0%, rgba(251, 251, 251, .35) 55%, rgba(251, 251, 251, 0) 100%);
  -webkit-mask-image: repeating-linear-gradient(to right, #000 0, #000 var(--grid-line), transparent var(--grid-line), transparent var(--grid-size)), repeating-linear-gradient(to bottom, #000 0, #000 var(--grid-line), transparent var(--grid-line), transparent var(--grid-size));
  -webkit-mask-position: 50% 50%, 50% 50%;
  mask-image: repeating-linear-gradient(to right, #000 0, #000 var(--grid-line), transparent var(--grid-line), transparent var(--grid-size)), repeating-linear-gradient(to bottom, #000 0, #000 var(--grid-line), transparent var(--grid-line), transparent var(--grid-size));
  mask-position: 50% 50%, 50% 50%;
}
/* Email Statement uses one full-frame grid. Outer geometry stays component-scoped. */
.es-container .features-graphic_grid-bg {position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

/* Transient SVG overlay; the reusable check icon is untouched underneath. */
.es-check {position:relative}
.es-check .es-send-animation {position:absolute;inset:0;display:block;width:100%;height:100%;overflow:visible;pointer-events:none}
.es-check[data-es-sending]>:not(.es-send-animation) {visibility:hidden}

.wm { width:100%; min-width:0; }
.wm-frame { position:relative; width:100%; aspect-ratio:258 / 232; overflow:hidden; border-radius:3.100775cqi; background-image:linear-gradient(135deg,#f6f6f6 0%,#fff 48.5989%,#f6f6f6 100%); }
.wm-grid { position:absolute; left:-16.5274%; top:-50.0741%; width:119.3798%; height:150%; }
.wm-map-position { position:absolute; left:3.17597%; top:20.18454%; width:93.57639%; height:59.40608%; transform:scaleX(-1); }
.wm-map { display:block; width:100%; height:auto; }
.wm-mask { position:absolute; inset:0; overflow:hidden; opacity:0; pointer-events:none; }
.wm-glow { position:absolute; top:0; left:0; width:75%; height:100%; background-image:linear-gradient(90deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.9) 50%,rgba(255,255,255,0) 100%); }
.wm-fade { position:absolute; left:-0.6359%; top:-0.07408%; width:100.7752%; height:100%; pointer-events:none; }
.wm-fade-left { background-image:linear-gradient(90deg,#fff 0%,rgba(255,255,255,0) 50%); }
.wm-fade-right { background-image:linear-gradient(270deg,#fff -3.01%,rgba(255,255,255,0) 50%); }

[data-worldwide-markets] { container-type:inline-size; writing-mode:horizontal-tb; }
[data-worldwide-markets] .wm-grid { --grid-size:14.72868cqi; --grid-line:.03876cqi; }
[data-worldwide-markets] .wm-mask { mask-size:100% 100%; mask-repeat:no-repeat; mask-mode:alpha; -webkit-mask-size:100% 100%; -webkit-mask-repeat:no-repeat; }
[data-worldwide-markets][data-wm-ready] .wm-mask { opacity:1; }
[data-worldwide-markets][data-wm-ready] .wm-fade { opacity:0; }
@media(prefers-reduced-motion:reduce) {
  [data-worldwide-markets][data-wm-ready] .wm-mask { opacity:0; }
  [data-worldwide-markets][data-wm-ready] .wm-fade { opacity:1; }
}
</style></head><body><main><div style="width:258px"><div class="wm" data-worldwide-markets="" role="img" aria-label="Worldwide Markets"><div class="wm-frame"><div class="features-graphic_grid-bg wm-grid" aria-hidden="true"></div><div class="wm-map-position"><img class="wm-map" src="/src/embeds/assets/worldwide-markets/map.svg" alt=""><div class="wm-mask" aria-hidden="true"><div class="wm-glow"></div></div></div><div class="wm-fade wm-fade-left" aria-hidden="true"></div><div class="wm-fade wm-fade-right" aria-hidden="true"></div></div></div>
</div><div style="width:360px"><div class="wm" data-worldwide-markets="" role="img" aria-label="Worldwide Markets"><div class="wm-frame"><div class="features-graphic_grid-bg wm-grid" aria-hidden="true"></div><div class="wm-map-position"><img class="wm-map" src="/src/embeds/assets/worldwide-markets/map.svg" alt=""><div class="wm-mask" aria-hidden="true"><div class="wm-glow"></div></div></div><div class="wm-fade wm-fade-left" aria-hidden="true"></div><div class="wm-fade wm-fade-right" aria-hidden="true"></div></div></div>

</div></main><script type="module" src="/src/embeds/worldwide-markets.js"></script></body></html>
