<script type="application/json" data-film-subtitle-data>[{"language":"en","label":"English","vtt":"WEBVTT\n\n1\n00:00:00.000 --> 00:00:03.340\nAs you all may know,\nthe new guy starts today.\n\n2\n00:00:08.080 --> 00:00:08.880\nGuys,\n\n3\n00:00:09.320 --> 00:00:13.260\nI heard that the new guy\nis so accurate\n\n4\n00:00:13.260 --> 00:00:16.440\nthat even the margin of error\navoids him.\n\n5\n00:00:17.560 --> 00:00:20.820\nI heard he can pinpoint anything.\n\n6\n00:00:21.900 --> 00:00:25.800\nWell, I hear he's incredibly\nefficient under pressure.\n\n7\n00:00:27.800 --> 00:00:29.740\nI heard that he finished\nQ4 report\n\n8\n00:00:29.740 --> 00:00:30.840\nbefore Q3 even ended.\n\n9\n00:00:31.620 --> 00:00:33.980\nI hear Elon calls him for advice.\n\n10\n00:00:37.040 --> 00:00:39.640\n♪ Who stepped in the room\nmaking everybody freeze? ♪\n\n11\n00:00:39.960 --> 00:00:42.080\n♪ With the tailored crease\nsharp enough to make them bleed. ♪\n\n12\n00:00:42.460 --> 00:00:44.600\n♪ Women adjusting their skirts,\nmen fixing their collars. ♪\n\n13\n00:00:44.780 --> 00:00:47.140\n♪ The legend walked in,\nnow we talking top dollars. ♪\n\n14\n00:00:47.420 --> 00:00:49.540\n♪ That's the kingpin,\ntell them who's running the floor. ♪\n\n15\n00:00:49.780 --> 00:00:52.040\n♪ The office kingpin,\nlock down every single door. ♪\n\n16\n00:00:52.280 --> 00:00:54.500\n♪ The board knows the name,\nyeah, the board knows the face. ♪\n\n17\n00:00:57.880 --> 00:01:01.760\nWith Stitch AI,\nyou can get things done fast.\n\n18\n00:01:03.820 --> 00:01:04.960\nReal fast.\n\n19\n00:01:05.800 --> 00:01:08.320\nGet instant analysis\nand offload work to agents\n\n20\n00:01:08.320 --> 00:01:10.260\nwith pinpoint accuracy.\n\n21\n00:01:25.120 --> 00:01:26.880\nSpatial awareness not included.\n\n22\n00:01:31.220 --> 00:01:33.020\nDid I mention I have excellent referrals?\n\n23\n00:01:33.900 --> 00:01:36.200\nSorry, we already found\nthe perfect guy for the job.\n"},{"language":"ar","label":"العربية","vtt":"WEBVTT\n\n1\n00:00:00.000 --> 00:00:03.340\nكما تعلمون جميعاً،\nيبدأ زميلنا الجديد العمل اليوم.\n\n2\n00:00:08.080 --> 00:00:08.880\nيا جماعة،\n\n3\n00:00:09.320 --> 00:00:13.260\nسمعت أن زميلنا الجديد\nدقيق للغاية،\n\n4\n00:00:13.260 --> 00:00:16.440\nلدرجة أن هامش الخطأ نفسه\nيتجنبه.\n\n5\n00:00:17.560 --> 00:00:20.820\nسمعت أنه يستطيع تحديد أي شيء\nبمنتهى الدقة.\n\n6\n00:00:21.900 --> 00:00:25.800\nأما أنا فسمعت أنه يعمل\nبكفاءة مذهلة تحت الضغط.\n\n7\n00:00:27.800 --> 00:00:29.740\nسمعت أنه أنهى\nتقرير الربع الرابع\n\n8\n00:00:29.740 --> 00:00:30.840\nقبل أن ينتهي الربع الثالث أصلاً.\n\n9\n00:00:31.620 --> 00:00:33.980\nسمعت أن إيلون يتصل به\nطلباً للنصيحة.\n\n10\n00:00:37.040 --> 00:00:39.640\n♪ من دخل الغرفة\nوجعل الجميع يتجمّدون؟ ♪\n\n11\n00:00:39.960 --> 00:00:42.080\n♪ بثنية بدلة مفصّلة\nحادّة بما يكفي لتُدميهم. ♪\n\n12\n00:00:42.460 --> 00:00:44.600\n♪ النساء يُعدّلن تنانيرهن،\nوالرجال يُسوّون ياقات قمصانهم. ♪\n\n13\n00:00:44.780 --> 00:00:47.140\n♪ دخل الأسطورة،\nوالآن نتحدث عن مبالغ طائلة. ♪\n\n14\n00:00:47.420 --> 00:00:49.540\n♪ إنه الزعيم،\nأخبرهم من يدير المكان. ♪\n\n15\n00:00:49.780 --> 00:00:52.040\n♪ زعيم المكتب،\nأغلقوا كل باب بإحكام. ♪\n\n16\n00:00:52.280 --> 00:00:54.500\n♪ مجلس الإدارة يعرف الاسم،\nأجل، مجلس الإدارة يعرف الوجه. ♪\n\n17\n00:00:57.880 --> 00:01:01.760\nمع Stitch AI،\nيمكنك إنجاز أعمالك بسرعة.\n\n18\n00:01:03.820 --> 00:01:04.960\nبسرعة فائقة.\n\n19\n00:01:05.800 --> 00:01:08.320\nاحصل على تحليلات فورية،\nوفوّض المهام إلى وكلاء الذكاء الاصطناعي\n\n20\n00:01:08.320 --> 00:01:10.260\nبدقة متناهية.\n\n21\n00:01:16.620 --> 00:01:19.780\nيمكن لأي شخص أن يصبح بطلاً\nمع Stitch AI.\n\n22\n00:01:20.140 --> 00:01:21.940\nذكاء اصطناعي حقيقي\nللعمل المصرفي الحقيقي.\n\n23\n00:01:25.120 --> 00:01:26.880\nالإدراك المكاني غير مشمول.\n\n24\n00:01:31.220 --> 00:01:33.020\nهل ذكرت أن لديّ توصيات ممتازة؟\n\n25\n00:01:33.900 --> 00:01:36.200\nعذراً، لقد وجدنا بالفعل\nالشخص المثالي للوظيفة.\n"},{"language":"vi","label":"Tiếng Việt","vtt":"WEBVTT\n\n1\n00:00:00.000 --> 00:00:03.340\nNhư mọi người đã biết,\nhôm nay người mới bắt đầu làm việc.\n\n2\n00:00:08.080 --> 00:00:08.880\nMọi người này,\n\n3\n00:00:09.320 --> 00:00:13.260\ntôi nghe nói người mới\nchính xác đến mức\n\n4\n00:00:13.260 --> 00:00:16.440\nngay cả sai số\ncũng phải tránh anh ấy.\n\n5\n00:00:17.560 --> 00:00:20.820\nTôi nghe nói anh ấy có thể\nxác định chính xác bất cứ thứ gì.\n\n6\n00:00:21.900 --> 00:00:25.800\nCòn tôi nghe nói anh ấy làm việc\ncực kỳ hiệu quả dưới áp lực.\n\n7\n00:00:27.800 --> 00:00:29.740\nTôi nghe nói anh ấy đã hoàn thành\nbáo cáo quý IV\n\n8\n00:00:29.740 --> 00:00:30.840\ntrước cả khi quý III kết thúc.\n\n9\n00:00:31.620 --> 00:00:33.980\nTôi nghe nói Elon còn gọi anh ấy\nđể xin lời khuyên.\n\n10\n00:00:37.040 --> 00:00:39.640\n♪ Ai vừa bước vào phòng\nkhiến tất cả sững người? ♪\n\n11\n00:00:39.960 --> 00:00:42.080\n♪ Nếp ly trên bộ đồ may đo\nsắc đến mức khiến họ đổ máu. ♪\n\n12\n00:00:42.460 --> 00:00:44.600\n♪ Phụ nữ chỉnh lại váy,\nđàn ông sửa lại cổ áo. ♪\n\n13\n00:00:44.780 --> 00:00:47.140\n♪ Huyền thoại đã bước vào,\ngiờ ta nói chuyện tiền khủng. ♪\n\n14\n00:00:47.420 --> 00:00:49.540\n♪ Đó là ông trùm,\ncho họ biết ai làm chủ nơi này. ♪\n\n15\n00:00:49.780 --> 00:00:52.040\n♪ Ông trùm văn phòng,\nkhóa chặt từng cánh cửa. ♪\n\n16\n00:00:52.280 --> 00:00:54.500\n♪ Hội đồng quản trị biết tên,\nđúng vậy, họ cũng biết mặt. ♪\n\n17\n00:00:57.880 --> 00:01:01.760\nVới Stitch AI,\nbạn có thể hoàn thành công việc nhanh chóng.\n\n18\n00:01:03.820 --> 00:01:04.960\nThật sự nhanh.\n\n19\n00:01:05.800 --> 00:01:08.320\nNhận kết quả phân tích tức thì\nvà giao việc cho các tác nhân AI\n\n20\n00:01:08.320 --> 00:01:10.260\nvới độ chính xác cao.\n\n21\n00:01:16.620 --> 00:01:19.780\nAi cũng có thể trở thành người hùng\nvới Stitch AI.\n\n22\n00:01:20.140 --> 00:01:21.940\nAI thực thụ\ncho nghiệp vụ ngân hàng thực tế.\n\n23\n00:01:25.120 --> 00:01:26.880\nKhông bao gồm khả năng nhận biết không gian.\n\n24\n00:01:31.220 --> 00:01:33.020\nTôi đã nói là mình có những\nlời giới thiệu rất tốt chưa?\n\n25\n00:01:33.900 --> 00:01:36.200\nXin lỗi, chúng tôi đã tìm được\nngười hoàn hảo cho công việc này rồi.\n"},{"language":"id","label":"Bahasa Indonesia","vtt":"WEBVTT\n\n1\n00:00:00.000 --> 00:00:03.340\nSeperti yang kalian tahu,\norang baru mulai bekerja hari ini.\n\n2\n00:00:08.080 --> 00:00:08.880\nTeman-teman,\n\n3\n00:00:09.320 --> 00:00:13.260\naku dengar orang baru itu\nsangat akurat,\n\n4\n00:00:13.260 --> 00:00:16.440\nsampai-sampai margin kesalahan\npun menghindarinya.\n\n5\n00:00:17.560 --> 00:00:20.820\nAku dengar dia bisa menentukan\napa pun dengan tepat.\n\n6\n00:00:21.900 --> 00:00:25.800\nKalau aku dengar, dia sangat\nefisien saat berada di bawah tekanan.\n\n7\n00:00:27.800 --> 00:00:29.740\nAku dengar dia menyelesaikan\nlaporan kuartal IV\n\n8\n00:00:29.740 --> 00:00:30.840\nbahkan sebelum kuartal III berakhir.\n\n9\n00:00:31.620 --> 00:00:33.980\nAku dengar Elon meneleponnya\nuntuk meminta saran.\n\n10\n00:00:37.040 --> 00:00:39.640\n♪ Siapa yang masuk ruangan\nhingga semua terpaku? ♪\n\n11\n00:00:39.960 --> 00:00:42.080\n♪ Dengan lipatan setelan jahitan khusus\nyang tajam hingga bisa melukai. ♪\n\n12\n00:00:42.460 --> 00:00:44.600\n♪ Para wanita merapikan rok,\npara pria membetulkan kerah. ♪\n\n13\n00:00:44.780 --> 00:00:47.140\n♪ Sang legenda masuk,\nkini kita bicara bayaran tertinggi. ♪\n\n14\n00:00:47.420 --> 00:00:49.540\n♪ Itulah sang bos,\nberi tahu siapa yang berkuasa di sini. ♪\n\n15\n00:00:49.780 --> 00:00:52.040\n♪ Sang bos kantor,\nkunci rapat setiap pintu. ♪\n\n16\n00:00:52.280 --> 00:00:54.500\n♪ Dewan direksi tahu namanya,\nya, mereka juga tahu wajahnya. ♪\n\n17\n00:00:57.880 --> 00:01:01.760\nDengan Stitch AI, Anda bisa\nmenyelesaikan pekerjaan dengan cepat.\n\n18\n00:01:03.820 --> 00:01:04.960\nSangat cepat.\n\n19\n00:01:05.800 --> 00:01:08.320\nDapatkan analisis instan\ndan delegasikan pekerjaan kepada agen AI\n\n20\n00:01:08.320 --> 00:01:10.260\ndengan akurasi tinggi.\n\n21\n00:01:16.620 --> 00:01:19.780\nSiapa pun bisa menjadi pahlawan\ndengan Stitch AI.\n\n22\n00:01:20.140 --> 00:01:21.940\nAI nyata\nuntuk perbankan nyata.\n\n23\n00:01:25.120 --> 00:01:26.880\nKesadaran spasial tidak termasuk.\n\n24\n00:01:31.220 --> 00:01:33.020\nSudah kubilang aku punya\nrekomendasi yang sangat bagus?\n\n25\n00:01:33.900 --> 00:01:36.200\nMaaf, kami sudah menemukan\norang yang tepat untuk pekerjaan ini.\n"}]</script>
