<style>.loan-management{container-type:inline-size;writing-mode:horizontal-tb}.loan-management-screen{mask-image:linear-gradient(to bottom,#000 4%,transparent 95%)}.loan-management-stage{mask-image:linear-gradient(to bottom,#000 30%,transparent 100%)}.loan-management.oc-revealing .loan-management-screen{animation:lm-up var(--motion-duration-default) var(--motion-ease-primary) both,lm-back calc(var(--motion-duration-default)*var(--reveal-opacity-ratio)) linear both}.loan-management.oc-revealing .loan-management-reveal{animation:lm-up var(--motion-duration-default) var(--motion-ease-primary) var(--reveal-stagger-default) both,lm-front calc(var(--motion-duration-default)*var(--reveal-opacity-ratio)) linear var(--reveal-stagger-default) both}@keyframes lm-up{from{transform:translateY(var(--reveal-offset-default))}to{transform:translateY(0)}}@keyframes lm-back{from{opacity:0}to{opacity:.55}}@keyframes lm-front{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){.loan-management.oc-revealing .loan-management-screen,.loan-management.oc-revealing .loan-management-reveal{animation:none}}</style>
