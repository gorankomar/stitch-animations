<style>

.lp-product-bar .lp-product-arrow,.lp-product-bar .lp-product-arrow-icon{display:block}
.lp-product-bar .lp-product-stop-square,.lp-product-bar .lp-product-stop-icon{display:none}

.lp-product-bar[data-product-state="working"] .lp-product-arrow,.lp-product-bar[data-product-state="working"] .lp-product-arrow-icon{display:none}
