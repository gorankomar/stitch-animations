<script>
(() => {
  const root = document.currentScript?.closest('[data-stitch-contact-form]');
  if (!root || root.dataset.contactBoot) return;
  root.dataset.contactBoot = 'true';
  const formElement = root.querySelector('form');
  const pendingFields = [formElement?.querySelector('select'),formElement?.querySelector('input[type="tel"]')].filter(Boolean);
  pendingFields.forEach(field => field.classList.add('lp-contact-pending'));
  const runtime = window.StitchContactRuntime ||= {resources:new Map(), nextId:0};
  const uid = 'stitch-contact-' + (++runtime.nextId);
  function loadScript(url, ready) {
    if (ready()) return Promise.resolve();
    if (!runtime.resources.has(url)) runtime.resources.set(url,new Promise((resolve,reject) => {
      const script = document.createElement('script'); script.src=url; script.async=true;
      script.onload=resolve; script.onerror=()=>{script.remove();runtime.resources.delete(url);reject(new Error('Unable to load contact form dependency'));};
      document.head.append(script);
    }));
    return runtime.resources.get(url);
  }
  const preferred = ['sa','us','ae','bh','qa','eg','om'];
  const normalize = s => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().trim();
  function init() {
    const select = root.querySelector('form select');
    const phone = root.querySelector('form input[type="tel"]');
    const globals = window.intlTelInputGlobals;
    const iti = phone && (globals?.getInstance(phone) || window.intlTelInput(phone,{initialCountry:'us',autoPlaceholder:'off',separateDialCode:true,preferredCountries:preferred}));
    if (!select || !iti || select.dataset.searchReady) return;
    const form = select.closest('form');
    // Scope labels/IDs per instance, so two copies on one page stay independent.
    root.querySelectorAll('form[id],input[id]:not([type="hidden"]),select[id],textarea[id]:not([name="g-recaptcha-response"]),label[id]').forEach(element => {
      const previous=element.id;
      root.querySelectorAll('label').forEach(label=>{if(label.htmlFor===previous)label.htmlFor=uid+'-'+previous;});
      element.id=uid+'-'+previous;
    });
    let codeInput = form.querySelector('input[name="Code"]');
    if (!codeInput) {codeInput=document.createElement('input');codeInput.type='hidden';codeInput.name='Code';form.append(codeInput);}
    const errorWrapper = form.querySelector('.phone-code-error');
    const email = form.querySelector('input[type="email"]');
    if (email) {
      email.addEventListener('invalid',()=>{email.setCustomValidity('');if(!email.validity.valid)email.setCustomValidity('Please use a valid business email.');});
      email.addEventListener('input',()=>email.setCustomValidity(''));
    }
    phone.addEventListener('input',()=>{phone.setCustomValidity('');if(errorWrapper)errorWrapper.style.display='none';});
    form.addEventListener('submit',event=>{
      if (!iti.isValidNumber()) {
        event.preventDefault(); event.stopImmediatePropagation();
        phone.setCustomValidity('Please enter a valid number');phone.reportValidity();
        if(errorWrapper){errorWrapper.style.display='block';errorWrapper.textContent='Please enter a valid number';}
      } else {phone.setCustomValidity('');if(errorWrapper)errorWrapper.style.display='none';}
    },true);
    const names = typeof Intl.DisplayNames === 'function' ? new Intl.DisplayNames(['en'],{type:'region'}) : null;
    const aliases = {'mm':'burma','kr':'korea, south','kp':'korea, north','ru':'russia','la':'laos','sy':'syria','ir':'iran','vn':'vietnam','tw':'taiwan','ci':"cote d'ivoire",'sz':'swaziland','mk':'macedonia','cg':'congo','cd':'democratic republic of the congo','ck':'republic of the cook islands','va':'holy see (vatican city)','vi':'virgin islands'};
    const options = Array.from(select.options);
    const countries = globals.getCountryData().map(c => {
      const english = c.name.split(' (')[0];
      const option = options.find(o => normalize(o.textContent) === (aliases[c.iso2] || normalize(english)) || (names && normalize(o.textContent) === normalize(names.of(c.iso2.toUpperCase()))));
      if (!option) { const added = new Option(english, english); select.add(added); options.push(added); }
      return {iso:c.iso2, dial:c.dialCode, name:option?.textContent || english, value:option?.value || english};
    });
    const sorted = countries.slice().sort((a,b) => a.name.localeCompare(b.name,'en'));
    const ordered = [...preferred.map(iso => countries.find(c => c.iso === iso)).filter(Boolean), ...sorted.filter(c => !preferred.includes(c.iso))];
    let syncing = false;
    const pickers = [];
    function current() { return countries.find(c => c.value === select.value); }
    function syncCode() {codeInput.value = iti.getSelectedCountryData().dialCode;phone.setCustomValidity('');}
    function refresh() { const country = current(); value.textContent = country?.name || select.selectedOptions[0]?.textContent || 'Select country'; selectedFlag.className = 'lp-country-artwork'; selectedFlag.dataset.country=country?.iso || 'us'; syncCode(); }
    function selectCountry(country, updatePhone = true) {
      if (!country || syncing) return;
      syncing = true;
      select.value = country.value;
      if (updatePhone && iti.getSelectedCountryData().iso2 !== country.iso) {
        const number = phone.value; iti.setCountry(country.iso); phone.value = number;
      }
      select.dispatchEvent(new Event('input',{bubbles:true}));
      select.dispatchEvent(new Event('change',{bubbles:true}));
      refresh(); syncing = false;
    }
    const picker = document.createElement('div'); picker.className = 'lp-country-picker';
    const trigger = document.createElement('button'); trigger.type = 'button'; trigger.className = 'lp-country-trigger ' + select.className.replace('lp-contact-pending','').trim();
    const flagSlot = document.createElement('span'); flagSlot.className = 'lp-country-selected-flag'; flagSlot.setAttribute('aria-hidden','true');
    const selectedFlag = document.createElement('span'); flagSlot.append(selectedFlag);
    const value = document.createElement('span'); value.id = uid + '-country-value'; trigger.append(flagSlot,value);
    const label = Array.from(form.querySelectorAll('label')).find(label=>label.htmlFor===select.id);
    if (label) {label.id ||= uid+'-country-label'; trigger.setAttribute('aria-labelledby',label.id + ' '+value.id);}
    picker.append(trigger); select.before(picker);
    const phonePicker = phone.closest('.iti');
    const phoneTrigger = phonePicker.querySelector('.iti__selected-flag');
    phonePicker.classList.add('lp-country-phone');
    function createPicker(root, button, id, title, phoneOnly = false) {
      id=uid+'-'+id;
      const panel = document.createElement('div'); panel.className = 'lp-country-panel'; panel.id = id + '-panel'; panel.hidden = true;
      panel.setAttribute('role','dialog'); panel.setAttribute('aria-label',title);
      const search = document.createElement('input'); search.type = 'search'; search.className = 'lp-country-search'; search.placeholder = 'Search countries…'; search.autocomplete = 'off';
      search.setAttribute('role','combobox'); search.setAttribute('aria-label','Search countries'); search.setAttribute('aria-autocomplete','list'); search.setAttribute('aria-expanded','true'); search.setAttribute('aria-controls',id + '-list');
      const list = document.createElement('div'); list.className = 'lp-country-list'; list.id = id + '-list'; list.setAttribute('role','listbox'); list.setAttribute('aria-label','Countries');
      const empty = document.createElement('div'); empty.className = 'lp-country-empty'; empty.textContent = 'No countries found'; empty.setAttribute('role','status');
      panel.append(search,list,empty); root.append(panel);
      button.setAttribute('aria-haspopup','dialog'); button.setAttribute('aria-controls',panel.id); button.setAttribute('aria-expanded','false');
      let filtered = [], active = -1;
      function highlight(index, scroll = true) {
        active = index;
        Array.from(list.children).forEach((row,i) => row.dataset.active = String(i === index));
        const row = list.children[index];
        if (row) {search.setAttribute('aria-activedescendant',row.id); if (scroll) row.scrollIntoView({block:'nearest'});}
        else search.removeAttribute('aria-activedescendant');
      }
      function close(focus = false) {panel.hidden = true; button.setAttribute('aria-expanded','false'); if (focus) button.focus();}
      function choose(index) {
        if (!filtered[index]) return;
        if (phoneOnly) {
          const number = phone.value;
          iti.setCountry(filtered[index].iso);
          phone.value = number;
          syncCode();
        } else selectCountry(filtered[index]);
        close(true);
      }
      function render() {
        const query = normalize(search.value);
        filtered = ordered.filter(c => normalize(c.name).includes(query) || c.dial.includes(query.replace(/^\+/,'')));
        list.replaceChildren();
        filtered.forEach((country,i) => {
          const row = document.createElement('div'); row.className = 'lp-country-option'; row.id = id + '-option-' + i;
          if (!query && i === preferred.length) row.classList.add('lp-country-divider');
          row.setAttribute('role','option'); row.setAttribute('aria-selected',String(phoneOnly ? country.iso === iti.getSelectedCountryData().iso2 : country.value === select.value));
          const flag = document.createElement('span'); flag.className = 'lp-country-flag'; flag.setAttribute('aria-hidden','true');
          const artwork=document.createElement('span');artwork.className='lp-country-artwork';artwork.dataset.country=country.iso;flag.append(artwork);
          row.append(flag,document.createTextNode(country.name + (phoneOnly ? '  +' + country.dial : '')));
          row.addEventListener('pointermove',()=>highlight(i,false)); row.addEventListener('mousedown',e=>e.preventDefault()); row.addEventListener('click',()=>choose(i)); list.append(row);
        });
        empty.hidden = filtered.length > 0;
        highlight(query ? (filtered.length ? 0 : -1) : filtered.findIndex(c=>phoneOnly ? c.iso===iti.getSelectedCountryData().iso2 : c.value===select.value),false); list.scrollTop = 0;
      }
      function open() {pickers.forEach(p=>p.close()); panel.hidden=false; button.setAttribute('aria-expanded','true'); search.value='';render();search.focus();}
      button.addEventListener('click',e=>{e.preventDefault();e.stopImmediatePropagation();panel.hidden ? open() : close();},true);
      button.addEventListener('keydown',e=>{if (['ArrowDown','ArrowUp','Enter',' '].includes(e.key)) {e.preventDefault();e.stopImmediatePropagation();open();}},true);
      search.addEventListener('input',render);
      search.addEventListener('keydown',e=>{
        if (['ArrowDown','ArrowUp','Home','End'].includes(e.key) && filtered.length) {e.preventDefault();highlight(e.key==='Home'?0:e.key==='End'?filtered.length-1:(active+(e.key==='ArrowDown'?1:-1)+filtered.length)%filtered.length);}
        else if (e.key==='Enter') {e.preventDefault();choose(active);}
      });
      root.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();close(true);}});
      root.addEventListener('focusout',()=>setTimeout(()=>{if(!root.contains(document.activeElement))close();},0));
      document.addEventListener('pointerdown',e=>{if(!root.contains(e.target))close();});
      pickers.push({close});
    }
    createPicker(picker,trigger,'lp-country','Choose primary country');
    createPicker(phonePicker,phoneTrigger,'lp-phone-country','Choose mobile country',true);
    select.classList.add('lp-country-native'); select.tabIndex=-1; select.dataset.searchReady='true';
    select.addEventListener('change',()=>{if(!syncing)selectCountry(current());});
    phone.addEventListener('countrychange',syncCode);
    select.addEventListener('invalid',()=>trigger.focus());
    form.addEventListener('reset',()=>setTimeout(()=>{selectCountry(current());pickers.forEach(p=>p.close());},0));
    selectCountry(current());
    pendingFields.forEach(field=>field.classList.remove('lp-contact-pending'));
  }
  async function start() {
    try {
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.21/js/intlTelInput.min.js',()=>!!window.intlTelInput);
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.21/js/utils.js',()=>!!window.intlTelInputUtils);
      init();
    } catch (error) {
      pendingFields.forEach(field=>field.classList.remove('lp-contact-pending'));
      delete root.dataset.contactBoot;
      console.warn('Contact form enhancement unavailable; native fields retained.',error);
    }
  }
  start();
})();
</script>
