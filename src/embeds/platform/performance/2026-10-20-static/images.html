    <script>
      (function() {
        // Map visitor country code to locale subdirectory
        var localeMap = {
          'SA': '/ar-sa', // Saudi Arabia -> Arabic
          'VN': '/vi-vn', // Vietnam -> Vietnamese
          'ID': '/id-id' // Indonesia -> Indonesian
        };

        // Paths that should ALWAYS load in English (never redirected)
        var excludedPaths = [
          '/money2020middleeast'
        ];

        var path = window.location.pathname;

        // Don't run on excluded paths
        for (var i = 0; i < excludedPaths.length; i++) {
          if (path.indexOf(excludedPaths[i]) === 0) return;
        }

        // Don't run if already on one of the localized paths
        for (var key in localeMap) {
          if (path.indexOf(localeMap[key]) === 0) return;
        }

        // Only auto-redirect once per session
        if (sessionStorage.getItem('localeChecked')) return;

        fetch('https://get.geojs.io/v1/ip/country.json')
          .then(function(res) {
            return res.json();
          })
          .then(function(data) {
            sessionStorage.setItem('localeChecked', '1');
            var target = data && localeMap[data.country];
            if (target) {
              var full = window.location.pathname + window.location.search;
              window.location.replace(target + full);
            }
          })
          .catch(function() {
            /* on any error, stay on default English */ });
      })();
    </script>

    <script>
      const clientId = '320855721983986218';
      const redirectUri = 'https://stitch.sa/callback';
      const issuer = 'https://dev.stitch.fi';

      function base64UrlEncode(str) {
        return btoa(String.fromCharCode(...new Uint8Array(str)))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      }

      async function generateCodeChallenge(verifier) {
        const encoder = new TextEncoder();
        const data = encoder.encode(verifier);
        const digest = await crypto.subtle.digest('SHA-256', data);
        return base64UrlEncode(digest);
      }

      document.getElementById('login-button').addEventListener('click', async () => {
        const codeVerifier = [...crypto.getRandomValues(new Uint8Array(64))]
          .map(x => ('0' + x.toString(16)).slice(-2)).join('');

        sessionStorage.setItem('pkce_verifier', codeVerifier);

        const codeChallenge = await generateCodeChallenge(codeVerifier);
        const state = crypto.randomUUID();

        const authUrl = `${issuer}/oauth/v2/authorize?` +
          `client_id=${clientId}` +
          `&response_type=code` +
          `&scope=openid profile email` +
          `&redirect_uri=${encodeURIComponent(redirectUri)}` +
          `&code_challenge=${codeChallenge}` +
          `&code_challenge_method=S256` +
          `&state=${state}`;

        window.location.href = authUrl;
      });
    </script>

    <script>
      document.addEventListener("DOMContentLoaded", function() {

        function closeAllFaqs() {
          faqAccordions.forEach(faq => {
            faq.classList.remove("active");

            const answer = faq.querySelector(".faq1_answer");
            const icon = faq.querySelector(".faq-icon-minus.plus");

            if (answer) {
              answer.style.height = answer.scrollHeight + "px"; // set current height
              requestAnimationFrame(() => {
                answer.style.height = "0px";
              });
            }

            if (icon) icon.style.transform = "rotate(90deg)";
          });
        }

        faqAccordions.forEach(faq => {
          faq.addEventListener("click", function() {
            const isActive = faq.classList.contains("active");

            // Close all first
            closeAllFaqs();

            // If clicked wasn't active, open it
            if (!isActive) {
              faq.classList.add("active");

              const answer = faq.querySelector(".faq1_answer");
              const icon = faq.querySelector(".faq-icon-minus.plus");

              if (answer) {
                answer.style.height = "0px"; // reset first
                const fullHeight = answer.scrollHeight + "px";
                requestAnimationFrame(() => {
                  answer.style.height = fullHeight;
                });
              }

              if (icon) icon.style.transform = "rotate(0deg)";
            }
          });

          // Set height if initially open
          if (faq.classList.contains("active")) {
            const answer = faq.querySelector(".faq1_answer");
            const icon = faq.querySelector(".faq-icon-minus.plus");

            if (answer) answer.style.height = answer.scrollHeight + "px";
            if (icon) icon.style.transform = "rotate(0deg)";
          }

        toggles.forEach((toggle) => {
          const dropdown = toggle.closest(".w-dropdown");
          if (!dropdown) return;

          const list = dropdown.querySelector(".navbar12_dropdown-list");
          if (!list) return;

          toggle.addEventListener(
            "click",
            function(event) {
              if (!isMobile()) return;

              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();

              closeAllSubmenus();

              submenuTimer = window.setTimeout(() => {
                // Prevent a pending mobile action from running on desktop.
                if (!isMobile()) return;

                list.classList.add("is-mobile-open");
                toggle.setAttribute("aria-expanded", "true");
                document.body.classList.add("submenu-open");
              }, 20);
            },
            true
          );
        });

        backButtons.forEach((backButton) => {
          backButton.addEventListener(
            "click",
            function(event) {
              if (!isMobile()) return;

              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();

              closeAllSubmenus();
            },
            true
          );
        });

        if (menuButton) {
          menuButton.addEventListener("click", function() {
            window.setTimeout(() => {
              if (!isMobile()) return;

              if (!menuButton.classList.contains("w--open")) {
                closeAllSubmenus();
              }
            }, 50);
          });
        }

        // Reset only when crossing the 991px / 992px breakpoint.
        mobileQuery.addEventListener("change", function() {
          closeAllSubmenus();
        });
      });
    </script>
